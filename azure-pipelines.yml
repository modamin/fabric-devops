# =============================================================================
# Trunk-Based Deployment Pipeline
# =============================================================================
# Branching model (Option 4):
#   - main            → synced to dev workspace via "Update from GIT" (no pipeline runs)
#   - uat/x.y        → deployed to uat workspace via fabric-cicd
#   - prod/x.y       → deployed to prod workspace via fabric-cicd
#
# Pipeline is manually triggered. Environment is auto-detected from branch name.
# The set of folders/items to deploy is provided in .deploy/config/deployment_selection.yml
# (see the 'Selective Deployment' stage), not derived from the branch name.
# Workspace configuration is loaded from Azure DevOps variable groups:
#   - fabric-uat   (for uat/* branches) — must define: targetWorkspaceId, targetWorkspaceName
#   - fabric-prod  (for prod/* branches) — must define: targetWorkspaceId, targetWorkspaceName
# =============================================================================

parameters:
  - name: devWorkspaceName
    displayName: "Fabric Dev Workspace Name (for artifact capture)"
    type: string
    default: "cicd-conn-mgmt-dev"

  - name: initNotebookName
    displayName: "Notebook Name to Run for Initialization"
    type: string
    default: "conn_mgmt_init_nb"

  # --- Stage selection toggles (choose which stages to run before queueing) ---
  - name: runCaptureArtifactIds
    displayName: "Run: Capture Artifact IDs"
    type: boolean
    default: true

  - name: runDeployAllArtifacts
    displayName: "Run: Deploy All Artifacts"
    type: boolean
    default: false

  - name: runSelectiveDeployment
    displayName: "Run: Selective Deployment (folders + single items)"
    type: boolean
    default: true

  - name: selectiveDeployConfig
    displayName: "Selective Deployment Config (YAML path)"
    type: string
    default: ".deploy/config/deployment_selection.yml"

  - name: runInitializeData
    displayName: "Run: Initialize Data"
    type: boolean
    default: true

  - name: runCreateSMConnections
    displayName: "Run: Create SM Connections"
    type: boolean
    default: true

  - name: runDeploySemanticModels
    displayName: "Run: Deploy Semantic Models"
    type: boolean
    default: true

variables:
  - name: pythonVersion
    value: "3.11"
  - name: fabricCicdVersion
    value: "latest"
  - name: msFabricCliVersion
    value: "latest"
  - name: repositoryDirectory
    value: "$(Build.SourcesDirectory)"

  # --- Branch-based environment detection ---
  - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/uat/') }}:
    - name: environment
      value: "UAT"
    - name: environmentLower
      value: "uat"
    - group: fabric-uat
  - ${{ elseif startsWith(variables['Build.SourceBranch'], 'refs/heads/prod/') }}:
    - name: environment
      value: "PROD"
    - name: environmentLower
      value: "prod"
    - group: fabric-prod
  - ${{ else }}:
    - name: environment
      value: ""
    - name: environmentLower
      value: ""

stages:
  # Stage 0: Validate Branch
  - stage: Validate_Branch
    displayName: "Validate Branch"
    jobs:
      - job: ValidateBranch
        displayName: "Validate Branch & Environment"
        pool:
          vmImage: "windows-latest"
        steps:
          - checkout: none
          - bash: |
              echo "##[section]Branch Validation"
              echo "Source Branch: $(Build.SourceBranch)"
              echo "Detected Environment: $(environment)"
              echo "Target Workspace ID: $(targetWorkspaceId)"
              echo "Target Workspace Name: $(targetWorkspaceName)"
            name: detectConfig
            displayName: "Detect Configuration"

          - bash: |
              if [ -z "$(environment)" ]; then
                echo "##[error]Pipeline must be run from a uat/* or prod/* branch."
                echo "##[error]Branch '$(Build.SourceBranch)' is not a valid release branch."
                echo "##[error]The main branch is synced to dev via 'Update from GIT' — no pipeline deployment needed."
                exit 1
              fi

              # Validate branch has a version segment: env/version (e.g. uat/1.0)
              BRANCH="$(Build.SourceBranch)"
              BRANCH_NAME="${BRANCH#refs/heads/}"
              SEGMENT_COUNT=$(echo "$BRANCH_NAME" | awk -F'/' '{print NF}')
              if [ "$SEGMENT_COUNT" -lt 2 ]; then
                echo "##[error]Branch must follow format: uat/<version> or prod/<version> (e.g. uat/1.0)"
                echo "##[error]Got: $BRANCH_NAME"
                exit 1
              fi

              echo "##[section]Environment '$(environment)' detected from branch '$(Build.SourceBranch)'"
            displayName: "Validate Branch Name"

  # Stage 1: Capture Artifact IDs from Dev Workspace
  - stage: Capture_Artifact_IDs
    displayName: "Capture Artifact IDs"
    dependsOn: Validate_Branch
    condition: and(succeeded(), eq('${{ parameters.runCaptureArtifactIds }}', 'true'))
    jobs:
      - job: CaptureIds
        displayName: "Capture Artifact Metadata"
        pool:
          vmImage: "windows-latest"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python ${{ variables.pythonVersion }}"
            inputs:
              versionSpec: "${{ variables.pythonVersion }}"

          - task: AzureCLI@2
            displayName: "Install Fabric CLI & Authenticate"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(Build.SourcesDirectory)/.deploy/install_fab_cli.ps1"
              arguments: '-FabricCliVersion "${{ variables.msFabricCliVersion }}"'
              addSpnToEnvironment: true

          - task: AzureCLI@2
            displayName: "Capture Artifact IDs"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(Build.SourcesDirectory)/.deploy/capture_artifact_ids.ps1"
              arguments: >-
                -WorkspaceName "${{ parameters.devWorkspaceName }}"
                -OutputPath "$(Build.ArtifactStagingDirectory)/artifact_mapping.json"
                -UpdateParameterYml
                -ParameterYmlPath "$(Build.SourcesDirectory)/parameter.yml"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Artifact Mapping"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/artifact_mapping.json'
              artifactName: 'artifact_mapping'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: "Publish Parameter YAML"
            inputs:
              targetPath: '$(Build.SourcesDirectory)/parameter.yml'
              artifactName: 'parameter_yml'
              publishLocation: 'pipeline'

  # Stage 2: Deploy All Artifacts
  - stage: Deploy_All_Artifacts
    displayName: "Deploy All Artifacts"
    dependsOn:
      - Validate_Branch
      - Capture_Artifact_IDs
    condition: and(not(failed()), eq('${{ parameters.runDeployAllArtifacts }}', 'true'))
    jobs:
      - job: DeployAll
        displayName: "Deploy All Artifacts"
        pool:
          vmImage: "windows-latest"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python ${{ variables.pythonVersion }}"
            inputs:
              versionSpec: "${{ variables.pythonVersion }}"

          - task: DownloadPipelineArtifact@2
            displayName: "Download Parameter YAML"
            inputs:
              artifactName: "parameter_yml"
              targetPath: '$(Build.SourcesDirectory)'

          - task: AzureCLI@2
            displayName: "Install Dependencies & Deploy All Artifacts"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -e

                echo "Installing fabric-cicd..."
                pip install fabric-cicd==${{ variables.fabricCicdVersion }} || pip install fabric-cicd

                echo "Deploying all artifacts in the repository"
                python .deploy/deploy_fabric.py \
                  --workspace-id "$(targetWorkspaceId)" \
                  --environment "$(environment)"
            env:
              FABRIC_WORKSPACE_ID: $(targetWorkspaceId)
              FABRIC_ENVIRONMENT: $(environment)

  # Stage 2b: Selective Deployment (folders + single items via YAML config)
  - stage: Selective_Deployment
    displayName: "Selective Deployment"
    dependsOn:
      - Validate_Branch
      - Capture_Artifact_IDs
    condition: and(not(failed()), eq('${{ parameters.runSelectiveDeployment }}', 'true'))
    jobs:
      - job: SelectiveDeploy
        displayName: "Selective Deployment (folders + single items)"
        pool:
          vmImage: "windows-latest"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python ${{ variables.pythonVersion }}"
            inputs:
              versionSpec: "${{ variables.pythonVersion }}"

          - task: DownloadPipelineArtifact@2
            displayName: "Download Parameter YAML"
            condition: eq('${{ parameters.runCaptureArtifactIds }}', 'true')
            inputs:
              artifactName: "parameter_yml"
              targetPath: '$(Build.SourcesDirectory)'

          - task: AzureCLI@2
            displayName: "Install Dependencies & Run Selective Deployment"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -e

                echo "Installing fabric-cicd..."
                pip install fabric-cicd==${{ variables.fabricCicdVersion }} || pip install fabric-cicd

                echo "Running selective deployment using config: ${{ parameters.selectiveDeployConfig }}"
                python .deploy/deploy_fabric.py \
                  --workspace-id "$(targetWorkspaceId)" \
                  --environment "$(environment)" \
                  --deploy-config "${{ parameters.selectiveDeployConfig }}"
            env:
              FABRIC_WORKSPACE_ID: $(targetWorkspaceId)
              FABRIC_ENVIRONMENT: $(environment)

  # Stage 3: Initialize Data (run notebook)
  - stage: Initialize_Data
    displayName: "Initialize Data"
    dependsOn:
      - Deploy_All_Artifacts
      - Selective_Deployment
    condition: and(not(failed()), eq('${{ parameters.runInitializeData }}', 'true'))
    jobs:
      - job: RunNotebook
        displayName: "Run Initialization Notebook"
        pool:
          vmImage: "windows-latest"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python ${{ variables.pythonVersion }}"
            inputs:
              versionSpec: "${{ variables.pythonVersion }}"

          - task: AzureCLI@2
            displayName: "Install Fabric CLI & Authenticate"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(Build.SourcesDirectory)/.deploy/install_fab_cli.ps1"
              arguments: '-FabricCliVersion "${{ variables.msFabricCliVersion }}"'
              addSpnToEnvironment: true

          - task: AzureCLI@2
            displayName: "Run Notebook"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(Build.SourcesDirectory)/.deploy/run_notebook.ps1"
              arguments: >-
                -WorkspaceName "$(targetWorkspaceName)"
                -NotebookName "${{ parameters.initNotebookName }}"

  # Stage 4: Create Semantic Model Connections
  - stage: Create_SM_Connections
    displayName: "Create SM Connections"
    dependsOn: Initialize_Data
    condition: and(not(failed()), eq('${{ parameters.runCreateSMConnections }}', 'true'))
    jobs:
      - job: CreateConnections
        displayName: "Create Semantic Model Connections"
        pool:
          vmImage: "windows-latest"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python ${{ variables.pythonVersion }}"
            inputs:
              versionSpec: "${{ variables.pythonVersion }}"

          - task: AzureCLI@2
            displayName: "Install Fabric CLI & Authenticate"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(Build.SourcesDirectory)/.deploy/install_fab_cli.ps1"
              arguments: '-FabricCliVersion "${{ variables.msFabricCliVersion }}"'
              addSpnToEnvironment: true

          - task: DownloadPipelineArtifact@2
            displayName: "Download Parameter YAML"
            condition: eq('${{ parameters.runCaptureArtifactIds }}', 'true')
            inputs:
              artifactName: "parameter_yml"
              targetPath: '$(Build.SourcesDirectory)'

          - task: AzureCLI@2
            displayName: "Create Connections & Update Parameter YAML"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(Build.SourcesDirectory)/.deploy/create_sm_connections_stage.ps1"
              arguments: >-
                -TargetWorkspaceName "$(targetWorkspaceName)"
                -ConnectionMappingPath "$(Build.SourcesDirectory)/.deploy/config/connection_mapping.yml"
                -Environment "$(environmentLower)"
                -GroupId "$(groupId)"
                -UserIds "$(userIds)"
                -ParameterYmlPath "$(Build.SourcesDirectory)/parameter.yml"

          - task: PublishPipelineArtifact@1
            displayName: "Publish Updated Parameter YAML"
            inputs:
              targetPath: '$(Build.SourcesDirectory)/parameter.yml'
              artifactName: 'parameter_yml_with_bindings'
              publishLocation: 'pipeline'

  # Stage 5: Deploy Semantic Models
  - stage: Deploy_Semantic_Models
    displayName: "Deploy Semantic Models"
    dependsOn:
      - Validate_Branch
      - Create_SM_Connections
    condition: and(not(failed()), eq('${{ parameters.runDeploySemanticModels }}', 'true'))
    jobs:
      - job: DeploySM
        displayName: "Deploy Semantic Models"
        pool:
          vmImage: "windows-latest"
        steps:
          - task: UsePythonVersion@0
            displayName: "Use Python ${{ variables.pythonVersion }}"
            inputs:
              versionSpec: "${{ variables.pythonVersion }}"

          - task: DownloadPipelineArtifact@2
            displayName: "Download Updated Parameter YAML"
            inputs:
              artifactName: "parameter_yml_with_bindings"
              targetPath: '$(Build.SourcesDirectory)'

          - task: AzureCLI@2
            displayName: "Install Dependencies & Deploy Semantic Models"
            inputs:
              azureSubscription: "$(azureServiceConnection)"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -e

                echo "Installing fabric-cicd..."
                pip install fabric-cicd==${{ variables.fabricCicdVersion }} || pip install fabric-cicd

                echo "Deploying semantic models from selection: ${{ parameters.selectiveDeployConfig }}"
                python .deploy/deploy_fabric.py \
                  --workspace-id "$(targetWorkspaceId)" \
                  --environment "$(environment)" \
                  --deploy-config "${{ parameters.selectiveDeployConfig }}" \
                  --items SemanticModel
            env:
              FABRIC_WORKSPACE_ID: $(targetWorkspaceId)
              FABRIC_ENVIRONMENT: $(environment)