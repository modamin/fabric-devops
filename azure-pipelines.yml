# DEV workspaces sync main to workspaces/data and workspaces/bi respectively.
# Queue uat/<version> or prod/<version>; both targets use the same release commit.
trigger: none
pr: none

parameters:
  - name: deploymentScope
    displayName: Workspaces to deploy
    type: string
    default: both
    values: [both, data, bi]
  - name: deploymentMode
    displayName: Items to deploy
    type: string
    default: selective
    values: [selective, full]
  - name: dataDeployConfig
    type: string
    default: .deploy/config/data_selection.yml
  - name: biDeployConfig
    type: string
    default: .deploy/config/bi_selection.yml
  - name: runInitializeData
    displayName: Run the data initialization notebook
    type: boolean
    default: true
  - name: refreshSemanticModels
    displayName: Refresh semantic models after connection binding
    type: boolean
    default: false
  - name: initNotebookName
    type: string
    default: conn_mgmt_init_nb

variables:
  - name: pythonVersion
    value: "3.11"
  - ${{ if startsWith(variables['Build.SourceBranch'], 'refs/heads/uat/') }}:
    - name: environment
      value: UAT
    - group: fabric-uat
  - ${{ elseif startsWith(variables['Build.SourceBranch'], 'refs/heads/prod/') }}:
    - name: environment
      value: PROD
    - group: fabric-prod
  - ${{ else }}:
    - name: environment
      value: INVALID

pool:
  vmImage: windows-latest

stages:
  - stage: Validate
    jobs:
      - job: ValidateRelease
        steps:
          - checkout: self
          - pwsh: |
              if ($env:BUILD_SOURCEBRANCH -notmatch '^refs/heads/(uat|prod)/[^/]+$') {
                throw "Queue a uat/<version> or prod/<version> branch. DEV is Git-managed."
              }
              $ids = @()
              foreach ($role in @('SOURCE_DATA', 'SOURCE_BI', 'TARGET_DATA', 'TARGET_BI')) {
                $id = [Environment]::GetEnvironmentVariable("${role}_WORKSPACE_ID")
                $name = [Environment]::GetEnvironmentVariable("${role}_WORKSPACE_NAME")
                if (-not $name -or $name.StartsWith('$(')) { throw "Missing ${role}_WORKSPACE_NAME." }
                $ids += ([guid]::Parse($id)).ToString()
              }
              if (@($ids | Select-Object -Unique).Count -ne 4) {
                throw "DEV/target data and BI workspaces must have four distinct IDs."
              }
            displayName: Validate release and workspace configuration
            env:
              SOURCE_DATA_WORKSPACE_ID: $(sourceDataWorkspaceId)
              SOURCE_DATA_WORKSPACE_NAME: $(sourceDataWorkspaceName)
              SOURCE_BI_WORKSPACE_ID: $(sourceBiWorkspaceId)
              SOURCE_BI_WORKSPACE_NAME: $(sourceBiWorkspaceName)
              TARGET_DATA_WORKSPACE_ID: $(targetDataWorkspaceId)
              TARGET_DATA_WORKSPACE_NAME: $(targetDataWorkspaceName)
              TARGET_BI_WORKSPACE_ID: $(targetBiWorkspaceId)
              TARGET_BI_WORKSPACE_NAME: $(targetBiWorkspaceName)

  - ${{ if ne(parameters.deploymentScope, 'bi') }}:
    - stage: Deploy_Data
      dependsOn: Validate
      condition: succeeded()
      jobs:
        - job: DeployData
          steps:
            - template: .deploy/templates/deploy-workspace.yml
              parameters:
                role: data
                mode: ${{ parameters.deploymentMode }}
                config: ${{ parameters.dataDeployConfig }}
                initialize: ${{ parameters.runInitializeData }}
                notebook: ${{ parameters.initNotebookName }}
            - publish: $(Build.ArtifactStagingDirectory)/data
              artifact: data_metadata
              displayName: Publish resolved data workspace metadata

  - ${{ if ne(parameters.deploymentScope, 'data') }}:
    - stage: Deploy_BI
      dependsOn:
        - Validate
        - ${{ if eq(parameters.deploymentScope, 'both') }}:
          - Deploy_Data
      condition: succeeded()
      jobs:
        - job: DeployBI
          steps:
            - ${{ if eq(parameters.deploymentScope, 'both') }}:
              - download: current
                artifact: data_metadata
            - template: .deploy/templates/deploy-workspace.yml
              parameters:
                role: bi
                mode: ${{ parameters.deploymentMode }}
                config: ${{ parameters.biDeployConfig }}
                refreshSemanticModels: ${{ parameters.refreshSemanticModels }}
                useDataArtifact: ${{ eq(parameters.deploymentScope, 'both') }}
            - publish: $(Build.ArtifactStagingDirectory)/bi
              artifact: bi_metadata
              displayName: Publish BI dependency manifest and parameters
