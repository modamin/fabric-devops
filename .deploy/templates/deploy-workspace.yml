parameters:
  - name: role
    type: string
  - name: mode
    type: string
  - name: config
    type: string
  - name: initialize
    type: boolean
    default: false
  - name: notebook
    type: string
    default: ""
  - name: useDataArtifact
    type: boolean
    default: false
  - name: refreshSemanticModels
    type: boolean
    default: false

steps:
  - checkout: self
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(pythonVersion)
  - pwsh: |
      python -m pip install -r .deploy/requirements.txt
      if ($LASTEXITCODE -ne 0) { throw "Deployment dependency installation failed." }
    displayName: Install deployment dependencies
  - task: AzureCLI@2
    displayName: Deploy and validate ${{ parameters.role }} workspace
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: pscore
      scriptLocation: scriptPath
      scriptPath: $(Build.SourcesDirectory)/.deploy/deploy_workspace.ps1
      arguments: >-
        -Role "${{ parameters.role }}"
        -Environment "$(environment)"
        -Mode "${{ parameters.mode }}"
        -DeployConfig "${{ parameters.config }}"
        -InitializeData "${{ parameters.initialize }}"
        -NotebookName "${{ parameters.notebook }}"
        -UseDataArtifact "${{ parameters.useDataArtifact }}"
        -RefreshSemanticModels "${{ parameters.refreshSemanticModels }}"
      addSpnToEnvironment: true
    env:
      SOURCE_DATA_WORKSPACE_ID: $(sourceDataWorkspaceId)
      SOURCE_DATA_WORKSPACE_NAME: $(sourceDataWorkspaceName)
      SOURCE_BI_WORKSPACE_ID: $(sourceBiWorkspaceId)
      SOURCE_BI_WORKSPACE_NAME: $(sourceBiWorkspaceName)
      TARGET_DATA_WORKSPACE_ID: $(targetDataWorkspaceId)
      TARGET_DATA_WORKSPACE_NAME: $(targetDataWorkspaceName)
      TARGET_BI_WORKSPACE_ID: $(targetBiWorkspaceId)
      TARGET_BI_WORKSPACE_NAME: $(targetBiWorkspaceName)
      CONNECTION_GROUP_ID: $(groupId)
      CONNECTION_USER_IDS: $(userIds)
